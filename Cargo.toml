[package]
name = "unified-trading-super-terminal"
version = "0.1.0"
edition = "2021"
description = "Bloomberg-style TUI for trading"

[[bin]]
name = "uterm"
path = "src/main.rs"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], optional = true }
dotenvy = "0.15"
anyhow = "1.0"
